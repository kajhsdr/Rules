# 京东 App Wskey 抓取 → 青龙面板
# Quantumult X → 重写 → 引用 → 添加本文件的地址：
#   https://cdn.jsdelivr.net/gh/kajhsdr/Rules@main/quantumultx/jd-wskey-capture.conf
# 青龙地址等配置已内置在脚本里，开箱即用

[rewrite_local]
^https?://sso\.jd\.com/appJdst/update url script-response-body https://cdn.jsdelivr.net/gh/kajhsdr/Rules@main/quantumultx/scripts/jd-wskey-capture.js
^https?://([a-z0-9-]+\.)*jd\.com/ url script-request-header https://cdn.jsdelivr.net/gh/kajhsdr/Rules@main/quantumultx/scripts/jd-wskey-capture.js

[mitm]
hostname = *.jd.com, *.jd.hk
