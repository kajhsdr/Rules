# 京东 App Wskey 抓取 → 青龙面板
# Quantumult X → 重写 → 引用 → 添加本文件的地址：
#   https://raw.githubusercontent.com/kajhsdr/Rules/main/quantumultx/jd-wskey-capture.conf
# 青龙地址等配置已内置在脚本里，开箱即用

[rewrite_local]
# 主路径：SSO 响应，一次拿全部账号的 pin + sessionTicket(=wskey)
^https?://sso\.jd\.com/appJdst/update url script-response-body https://raw.githubusercontent.com/kajhsdr/Rules/main/quantumultx/scripts/jd-wskey-capture.js

# 补充路径：sh.jd.com/d 请求 Cookie 直接带 wskey，触发时机是打开 App 或「我的 → 消息」
^https?://sh\.jd\.com/d url script-request-header https://raw.githubusercontent.com/kajhsdr/Rules/main/quantumultx/scripts/jd-wskey-capture.js

# 这条只为缓存 pt_pin ↔ pin_hash 映射，给上面的 pin_hash 反查账号用。
# 用纯前缀正则，不写 lookahead，避免 QX 正则兼容问题导致整条静默失效。
^https?://api\.m\.jd\.com/ url script-request-header https://raw.githubusercontent.com/kajhsdr/Rules/main/quantumultx/scripts/jd-wskey-capture.js
^https?://sso\.jd\.com/ url script-request-header https://raw.githubusercontent.com/kajhsdr/Rules/main/quantumultx/scripts/jd-wskey-capture.js

# 兜底：实测全站唯一会带 wskey 的旧接口
^https?://im-x\.jd\.com/ url script-request-header https://raw.githubusercontent.com/kajhsdr/Rules/main/quantumultx/scripts/jd-wskey-capture.js

[mitm]
hostname = *.jd.com, *.jd.hk
